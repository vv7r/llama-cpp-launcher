[package]
name = "uillamacpp"
version = "1.0.1"
edition = "2021"
rust-version = "1.95"
description = "Single-file Windows GUI to run, tune and benchmark llama.cpp (llama-server / llama-bench)"
authors = ["vv7r"]
repository = "https://github.com/vv7r/llama-cpp-launcher"
license = "MIT"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rfd = "0.17.2"
chrono = "0.4.45"
anyhow = "1.0.104"
egui_plot = "0.37"
egui_extras = { version = "0.36.1", default-features = false }

# HTTPS : le TLS de Windows (certificats du système, proxy d'entreprise) ;
# sous Linux, rustls, en pur Rust, pour n'exiger aucune bibliothèque TLS
# installée. Dans les deux cas, le magasin de certificats du système.
[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
ttf-parser = "0.25.1"
