name: release

# Publie un exécutable unique à chaque tag `v*`, et permet de le
# construire à la demande depuis l'onglet Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      # Même script qu'en local : chemins de compilation retirés du binaire,
      # exe copié dans dist/llama-cpp-launcher.exe.
      - name: Build
        shell: pwsh
        run: ./scripts/build-release.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-launcher-windows-x64
          path: dist/llama-cpp-launcher.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/llama-cpp-launcher.exe
          generate_release_notes: true

  # Exécutable Linux x86_64. Compilé sur la plus ancienne Ubuntu disponible :
  # un binaire lié à une glibc ancienne tourne sur les distributions plus
  # récentes, l'inverse est faux.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Build
        run: ./scripts/build-release.sh

      - uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-launcher-linux-x86_64
          path: dist/llama-cpp-launcher-linux-x86_64.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/llama-cpp-launcher-linux-x86_64.tar.gz
          generate_release_notes: true
